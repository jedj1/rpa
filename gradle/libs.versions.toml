# mcp-kotlin-sdk fork (rikkahub/mcp-kotlin-sdk). rikka.2 typed ToolSchema.type as String,
# so a tool whose outputSchema root is a union such as ["object","null"] failed the whole
# tools/list response with "Expected JsonPrimitive, but had JsonArray ... at path: $.type"
# — which is what api.githubcopilot.com/mcp/ hit. Commit d33ebb6 (shipped in rikka.4)
# widens `type` to JsonElement? and keeps unknown root keywords in `additionalKeywords`, so
# a received schema round-trips unchanged. rikka.2 already carried the 2026-07-28
# request-scoped client, so for us this bump is the schema fix plus a JitPack JDK fix,
# not a new client protocol.
mcp = "0.15.0-rikka.4"
