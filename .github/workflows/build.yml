      - name: Show pure APK sizes
        run: ls -la app/build/outputs/apk/pure/*.apk || true

      - name: Upload pure APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-pure
          # arm64-v8a only. Every phone since ~2015 is arm64; x86_64 is only for
          # emulators, and the universal APK is the fat superset. Uploading all
          # three (the old `*.apk` glob) made the artifact ~171MB and cost real
          # mobile data to download for an APK that never gets installed.
          #
          # This is the upload path, NOT the build: `assemblePure` still produces
          # all three APKs (see splits.abi in app/build.gradle.kts), so changing
          # it costs no CI time and keeps the other two available on the runner
          # if anyone ever needs to fetch them by hand.
          path: app/build/outputs/apk/pure/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
