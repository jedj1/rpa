name: build

on:
  push:
    branches:
      - master
      - 'feat/**'
      # Maintenance branches (CI tweaks, dependency bumps, docs) build too — they
      # are still code that will be merged, so they deserve the same gate.
      - 'chore/**'
    # Doc-only pushes (README, notes, licence) do not need a 13-20 min assemblePure
    # run: no source, resource or build file changes are involved. A push is
    # skipped only when *every* changed path matches; mixing docs with code still
    # triggers CI. Add `[skip ci]` to the commit message for one-off skips.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
    # Same rule for PRs: a docs-only PR stays mergeable without burning a run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # NDK >= r23 reads this and, when ccache is on PATH, routes the C/C++
  # toolchain through it. llama.cpp (a submodule, thousands of translation
  # units x arm64-v8a + x86_64) is by far the longest pole, so a warm ccache
  # turns a full native compile into a near-noop.
  ANDROID_USE_CCACHE: '1'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Run the native build with a fixed 4 jobs. CMake's Make generator (the
  # default here) is single-threaded without this, so the llama.cpp compile was
  # effectively serial on a 4-vCPU runner. Ninja would also do it, but this is a
  # one-liner and works with the generator already in use.
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Two lanes instead of one, with no dependency between them: each one is
  # work the old serial job did in sequence, and neither produces input for
  # the other.
  #
  # The old single job ran `assemblePure :app:testPureUnitTest
  # :ai:testDebugUnitTest` in one Gradle invocation, so nothing overlapped:
  # the unit tests only started after the APK had finished assembling, and
  # ccache, bun, pnpm, Gradle, the lockfile bootstrap and the SDK inventory
  # all ran in front of a 13-20 min Gradle step.
  #
  # Wall clock for the whole run is now the *slower* of the two lanes, not
  # their sum. Setup is shared through .github/actions/setup-toolchain so
  # both lanes see a byte-identical toolchain.
  # ───────────────────────────────────────────────────────────────────────
  assemble:
    name: assemblePure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          native-cache: 'true'

      - name: Show toolchain versions
        run: |
          java -version
          bun --version
          pnpm --version
          nproc
          echo "--- ccache ---"
          which ccache && ccache --version && ccache -s || echo "ccache NOT installed"

      # Single Gradle invocation: one daemon, one configuration phase. Build only
      # the shipping variant ("pure": R8 + optimized resource shrinking, keep rules
      # in src/main/keepRules) and run the JVM unit tests against that same variant.
      # The old debug build is gone on purpose: it compiled every library subproject
      # a second time and rebuilt the llama.cpp native libs a second time, for an
      # artifact nothing shipped. The published APK is `app-*-pure-unsigned.apk`,
      # re-signed on the VPS with p2.keystore (dl2.sh apk-pure).
      #
      # `:app:testPureUnitTest` and `:ai:testDebugUnitTest` live in the tests
      # lane now, so this lane finishes as soon as the APK exists.
      - name: Assemble pure APK
        env:
          # Fast lane: a push to a non-master branch (feat/**) skips the release
          # lint pass. master pushes and pull requests keep lintVital as the
          # release gate — see skipLintVital in app/build.gradle.kts.
          SKIP_LINT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}
        run: |
          FLAGS=""
          if [ "$SKIP_LINT" = "true" ]; then
            echo "fast lane: -PskipLintVital"
            FLAGS="-PskipLintVital"
          fi
          ./gradlew :app:assemblePure $FLAGS --stacktrace --parallel --build-cache

      - name: Show pure APK sizes
        run: ls -la app/build/outputs/apk/pure/*.apk || true

      - name: Upload pure APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-pure
          path: app/build/outputs/apk/pure/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show ccache stats
        if: always()
        run: ccache -s -v || true

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Show toolchain versions
        run: |
          java -version
          bun --version
          pnpm --version
          nproc

      # :ai:testDebugUnitTest is listed explicitly: :app:testPureUnitTest does not
      # run the library modules' tests, so the provider request-shape tests in
      # :ai never executed in CI. They are plain JVM tests (android.util.Log is
      # stubbed via returnDefaultValues), so this is seconds, not minutes.
      #
      # Same lint gating as the assemble lane, so a red release gate still
      # fails on the branch that carries it.
      - name: Run unit tests
        env:
          SKIP_LINT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}
        run: |
          FLAGS=""
          if [ "$SKIP_LINT" = "true" ]; then
            FLAGS="-PskipLintVital"
          fi
          ./gradlew :app:testPureUnitTest :ai:testDebugUnitTest $FLAGS \
            --stacktrace --parallel --build-cache

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            ai/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
